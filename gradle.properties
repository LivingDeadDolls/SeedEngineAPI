# Important Notes:
# A field used as ${...} in fabric.mod.json, *.mixins.json or pack.mcmeta must also be added to the expandProps map
# in build-logic/src/main/groovy/multiloader-common.gradle.

# Project
version=0.1.0
group=io.github.livingdeaddolls
java_version=25

# Common
minecraft_version=26.2
mod_name=Seed Engine API
mod_author=Yuhrp
mod_id=seedengine
license=MIT
credits=
description=A library mod that works out what a world generates from its seed, using the game's own code, for other mods to use.
# Game versions the jar loads on (fabric.mod.json)
fabric_minecraft_dependency=~26.2
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.161.0+26.2
fabric_loader_version=0.19.5

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.configuration-cache=true
